# .goreleaser.yaml — GoReleaser v2 config for the Calabi community edition.
#
# GENERATED into the public mirror by scripts/export-community.sh from this
# source (docs/community-goreleaser.yaml in the private monorepo). Edit it HERE,
# not in the public repo — the next `sync-public.sh` overwrites the public copy.
#
# The public repo is a go.work workspace (apps/client, apps/calabi-edge, pkg/*).
# Builds run from the repo ROOT (no per-build `dir:`) so the workspace stays
# active and resolves the in-tree cross-module deps (pkg/protocol, etc.).
# Triggered by pushing a `v*` tag; see .github/workflows/release.yml.
version: 2

project_name: calabi

builds:
  - id: calabi
    main: ./apps/client/cmd/calabi
    binary: calabi
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: calabi-edge
    main: ./apps/calabi-edge/cmd/calabi-edge
    binary: calabi-edge
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: [-s -w]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# One archive per OS/arch containing BOTH binaries (default = all builds).
archives:
  - id: archive
    name_template: "calabi_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - docs/community-edition.md
      - docs/examples/tunnels.yaml

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  draft: false
  prerelease: auto
  footer: |
    ---
    Self-hosted tunneling — run the edge + client on your own infrastructure.
    See the README to get started.

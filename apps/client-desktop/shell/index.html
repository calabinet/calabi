<!DOCTYPE html>
<!--
  shell/index.html — the loading screen shown while the bundled daemon
  comes up. This is the bundle "frontendDist"; the real UI is the SPA
  the daemon embeds and serves on its local console port.

  The native side (src-tauri/src/main.rs) supervises the daemon, picks a
  free console port (7400, else the next free one), and once /healthz
  answers it redirects this window to http://127.0.0.1:<that-port> via
  window.location.replace. We deliberately do NOT hard-code :7400 here:
  a separately-installed calabi service can squat :7400 with an OLD
  binary, and we must show the bundled daemon, not whatever owns :7400.
  On failure the native side rewrites #msg with a retry hint.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calabi · 启动中</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center;
           justify-content: center; background: #f5f7fa; color: #1f2937;
           font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                        "Microsoft YaHei", sans-serif; }
    .card { background: #fff; padding: 40px 50px; border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08); text-align: center;
            max-width: 360px; }
    h1 { font-size: 18px; margin: 0 0 8px; color: #1677ff; }
    p { font-size: 13px; color: #64748b; margin: 0; }
    .spinner { width: 24px; height: 24px; border: 2.5px solid #e5e7eb;
               border-top-color: #1677ff; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 18px auto 14px; }
    .err { color: #ef4444; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calabi 正在启动</h1>
    <div class="spinner"></div>
    <p id="msg">连接本地守护进程...</p>
  </div>
  <!--
    No probe/redirect here: the native side navigates this window to the
    daemon's real console port once /healthz answers (and rewrites #msg on
    failure). Keeping it dumb avoids racing the supervisor and avoids
    hard-coding a port the daemon may not own.
  -->
</body>
</html>

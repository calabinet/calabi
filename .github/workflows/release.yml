# release.yml — tag-triggered binary release for the Calabi community edition.
#
# GENERATED into the public mirror by scripts/export-community.sh from this
# source (docs/community-release-workflow.yml). Edit it HERE, not in the public
# repo. Pushing a tag like `v0.1.0` builds calabi + calabi-edge for
# linux/macOS/windows on amd64+arm64 and publishes a GitHub Release via
# GoReleaser (config: .goreleaser.yaml).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release and upload the binaries

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog can be built

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Provided automatically by Actions; contents:write (above) lets it
          # create the Release. No extra secret needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

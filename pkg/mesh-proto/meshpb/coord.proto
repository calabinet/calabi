// coord.proto — v0 of the node<->coordinator API for Calabi mesh.
//
// ⚠ DELIBERATELY NOT under the repo's top-level proto/ tree. The root buf module
// (proto/buf.yaml) generates EVERYTHING it sees into pkg/api — the control-plane
// module that is NEVER open-sourced. Generating the mesh coordination contract
// there would defeat the isolation invariant (see ../doc.go). So this file lives
// inside the pkg/mesh-proto module with its OWN buf module + gen config, using
// LOCAL plugins (no network, no protoc). Regenerate with:
//
//   cd pkg/mesh-proto && buf generate
//
// -> meshpb/coord.pb.go + meshpb/coord_grpc.pb.go (package meshpb). Also wired
// as `make proto-mesh`.
syntax = "proto3";

package calabi.mesh.v1;

option go_package = "github.com/calabi/calabi/pkg/mesh-proto/meshpb;meshpb";

// Coordinator is the mesh control plane ("the brains"). Nodes authenticate out
// of band (identity-svc auth key / interactive login) and then speak only this
// API. The coordinator sees METADATA (keys, endpoints, the netmap) but never
// node<->node payload — that is WireGuard end-to-end encrypted.
service Coordinator {
  // RegisterNode enrolls a node into its meshnet (= org): the coordinator
  // records its public keys, allocates an overlay IP (IPAM), and returns the
  // node's identity within the mesh.
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  // GetRegisterChallenge hands a node a one-time challenge that RegisterNode
  // requires it to answer with its node private key (mesh protocol v2). An org
  // credential says which meshnet the caller belongs to; only this proof says
  // which DEVICE it is, so knowing a node key - public within an org - is no
  // longer enough to enroll it or take its record over.
  rpc GetRegisterChallenge(GetRegisterChallengeRequest) returns (GetRegisterChallengeResponse);

  // SignOut ends this node's ability to re-register by proof alone (node_reauth,
  // see RegisterNodeRequest.node_id): until it next enrolls with an auth key, the
  // coordinator refuses to take it back on its node key. The node's record, its
  // overlay address and its seat stay. Called on sign-out, best effort.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);

  // ListNodes lists the caller's meshnet — every device, reachable from the
  // caller or not, with whether it is online — for a self-hosted coordinator's
  // own apps: the phone's device list. A coordinator whose credentials come
  // from an identity service answers PermissionDenied: there, device lists are
  // served by the platform's API, which is where who may see what is decided.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // ReportTunnels uploads the reverse tunnels this node's daemon serves, for a
  // self-hosted coordinator's apps (docs/runbook/self-hosted-sign-in-plan.md
  // §五): the whole current list, which replaces the one reported before, and
  // the bytes each tunnel carried since the node's last accepted report.
  // Information only — a tunnel grants nothing in the mesh, so nothing here
  // needs approving. PermissionDenied on a coordinator whose credentials come
  // from an identity service: the platform keeps its tunnels in its own services.
  rpc ReportTunnels(ReportTunnelsRequest) returns (ReportTunnelsResponse);

  // ListTunnels lists what every node of the caller's meshnet last reported
  // with ReportTunnels. Self-hosted only, like ListNodes.
  rpc ListTunnels(ListTunnelsRequest) returns (ListTunnelsResponse);

  // GetUsage is the traffic the caller's meshnet sent through this server —
  // its tunnels, and mesh traffic its relays carried; a direct path never
  // touches the server — plus its device count. Self-hosted only.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);

  // OpenViewSession proves the node key exactly as RegisterNode does (a
  // challenge from GetRegisterChallenge with node_id and node_key, no auth key),
  // and returns a token that ListNodes, ListTunnels and GetUsage accept for a
  // few minutes. It neither replaces the node's live session nor makes it
  // online: it is how a phone shows its server while it is not connected.
  // Self-hosted only.
  rpc OpenViewSession(OpenViewSessionRequest) returns (OpenViewSessionResponse);

  // GetEdgeAccess is what a node needs to serve tunnels through this server's
  // edge (docs/runbook/self-hosted-server-plan.md §3.1): where the edge is, how
  // to trust its certificate, and a grant the edge accepts — the same signed,
  // short-lived statement relays accept, since one calabi-edge is both. Takes a
  // live session's token or a view token, so a device whose mesh is switched off
  // still serves tunnels. A disabled, signed-out or deleted node gets nothing.
  // Self-hosted only.
  rpc GetEdgeAccess(GetEdgeAccessRequest) returns (GetEdgeAccessResponse);

  // PullNetMap is a long-lived server stream. The coordinator pushes a fresh
  // NetMap whenever topology or ACL changes, so the node reprograms its
  // WireGuard peers live without reconnecting.
  rpc PullNetMap(PullNetMapRequest) returns (stream NetMap);

  // ReportEndpoints uploads the node's freshly discovered candidate endpoints
  // (local interfaces + STUN-reflexive) and, once measured, the relay region it
  // is closest to. The coordinator relays both to peers via their NetMap so hole
  // punching can begin and relayed traffic takes the nearest hop (MESH.4).
  rpc ReportEndpoints(ReportEndpointsRequest) returns (ReportEndpointsResponse);

  // UpdateNodeDeclarations changes what an ALREADY-ENROLLED node declares about
  // itself, without re-enrolling it.
  //
  // Declarations used to travel only on RegisterNode, so editing a service list
  // meant tearing the session down and building it back up: new WireGuard
  // config, re-dialled relays, re-punched direct paths, and a home-relay flap —
  // seconds of disrupted traffic for a metadata edit that changes no addresses.
  //
  // It is deliberately NOT a general "update the node" call. Only the fields a
  // node merely ASSERTS about itself live here, and each is recorded exactly as
  // RegisterNode records it (declarations stay pending until a human confirms
  // them; the fingerprint stays display-only). Anything an admin can pin — name,
  // tags, route approvals — is out of scope: those are decisions ABOUT the node,
  // and a node must not be able to move them.
  //
  // FailedPrecondition when the node key isn't enrolled in this meshnet, so a
  // caller that raced a wipe falls back to RegisterNode instead of silently
  // doing nothing.
  rpc UpdateNodeDeclarations(UpdateNodeDeclarationsRequest) returns (UpdateNodeDeclarationsResponse);

  // ReportServiceHealth uploads what a node OBSERVES about the services it
  // declares — not what it claims about them.
  //
  // It answers the question the console otherwise cannot: an admin writes a rule
  // naming a service, confirms it, and it still does not work. The usual cause
  // is that the application is bound to 127.0.0.1 only, so opening the port in
  // the packet filter changes nothing — a peer's packet arrives on the tun
  // interface addressed to the overlay address and finds no socket. The node is
  // the only party that can tell the two cases apart, by dialing BOTH its own
  // target and its own overlay address.
  //
  // Observation, deliberately, not configuration: nothing here grants anything,
  // so a node lying costs it a wrong badge on its own row. The coordinator keeps
  // only the CURRENT value and does not persist it — a history of which port
  // answered when is exactly the kind of record §八 says not to accumulate.
  rpc ReportServiceHealth(ReportServiceHealthRequest) returns (ReportServiceHealthResponse);

  // ReportConnections uploads WHO this node exchanged traffic with in a window:
  // the peer, when, how many bytes each way, and whether the path was direct or
  // relayed. It is the data-plane half of an audit trail — the control-plane
  // half (who changed a rule, who approved a device) already lives in
  // audit-svc's hash chain.
  //
  // This REVISES the "current value, never a time series" rule in
  // docs/runbook/mesh-console-ux-plan.md §八-3, and the revision is deliberately
  // narrow. What that rule was protecting is spelled out there: a sequence of a
  // laptop's ENDPOINT ADDRESSES is a location trail, because a public IP reverse
  // -resolves to a place and an ISP. So endpoints are still current-value only,
  // and this message carries none — no endpoint, no public IP, no port. A peer
  // pair plus a byte count is an access trail, which is the thing an enterprise
  // buyer is asking for when they ask for audit.
  //
  // Still metadata, never content: the coordinator's promise that it cannot see
  // what flows between nodes is unchanged, and nothing here comes close to it.
  //
  // SELF-REPORTED, like every other declaration. A compromised endpoint can
  // under-report its own connections, so this is observational evidence and not
  // proof — the same status as endpoint telemetry everywhere else. Say so in the
  // console rather than letting a reader assume it is tamper-proof.
  rpc ReportConnections(ReportConnectionsRequest) returns (ReportConnectionsResponse);
}

message RegisterNodeRequest {
  // Base64 (WireGuard-style) public keys. Private keys never leave the node.
  string node_key = 1;
  string disco_key = 2;
  // Human label used for MagicDNS (MESH.6): <name>.<meshnet>.mesh.calabi.net
  string name = 3;
  // Opaque auth-key/token proving the node may join a meshnet (verified by
  // identity-svc on the platform build; a static file on the self-hosted coord).
  string auth_key = 4;
  // Highest protocol version + capabilities the node speaks (see version.go).
  uint32 protocol_version = 5;
  repeated string capabilities = 6;
  // Subnet routes this node advertises (CIDRs it can forward to, e.g.
  // "192.168.1.0/24"). The coordinator, once it approves them, adds them to this
  // node's allowed_ips in peers' netmaps so they route the CIDR here (MESH.7).
  repeated string advertised_routes = 7;
  // device_fingerprint is the daemon's per-install id (the same one it registers
  // with on the Publish side). A CLAIM, like name: it exists only so the console
  // can offer "open this machine's client details" and is never used for
  // authorization. The console resolves it against the org's own device list and
  // shows nothing when it doesn't match, so a bogus value costs a link, not
  // access. Empty from a daemon that has never registered a device.
  string device_fingerprint = 8;
  // Services this node's OPERATOR declared in its config (name + proto + port).
  // A CLAIM, deliberately: a service name is an ACL selector, so a node that
  // could name its own services could name one that is granted access and pull
  // that traffic to itself. The coordinator therefore records these as PENDING
  // and an admin confirms them in the console before any rule matches — same
  // shape as advertised_routes above. Declared here so agent / IaC machines
  // need no console visit to propose what they offer.
  repeated DeclaredService declared_services = 9;
  // aliased_routes are the advertised_routes this node asks to be published to
  // peers under a UNIQUE stand-in prefix instead of their own addresses, because
  // it expects them to collide with consumers' own LANs — 192.168.1.0/24 is
  // everywhere, and a consumer that is itself on it can never reach this one.
  // Must be a subset of advertised_routes; the coordinator ignores the rest.
  //
  // A REQUEST, like advertised_routes: an alias is granted only once an admin
  // has also approved the route. Only the publisher can know its LAN is one of
  // the crowded ones — the coordinator cannot see consumers' local subnets, so
  // it cannot guess, and aliasing a route that does not collide costs everyone a
  // change of address for nothing.
  repeated string aliased_routes = 10;
  // Proof of possession (mesh protocol v2): the challenge this registration
  // answers, and the box sealed over it with the node private key
  // (meshproto.SealRegisterProof). Refused without both.
  string challenge_id = 11;
  bytes register_proof = 12;
  // os is the machine's platform as the daemon's own runtime reports it
  // ("windows", "linux", "darwin"). A CLAIM, like name — display only, never
  // consulted for authorization, so a node lying about it costs itself an
  // accurate icon and nothing else.
  //
  // Sent because "which of these is the Windows box" is one of the two
  // questions a peer list has to answer (the other, whose machine it is, the
  // coordinator resolves from the auth key). Nobody else can answer it: the
  // coordinator never sees the host, and no other message carries it.
  string os = 13;
  // block_incoming is the machine's OWN refusal of all inbound connections
  // ("shields up"). Enforcement is entirely LOCAL — the node's packet filter
  // drops the traffic itself, so this is not how the setting takes effect and
  // clearing it here would not open the machine up. It is reported for ONE
  // reason: without it, a machine that answers nobody is indistinguishable in
  // the console from a healthy one, and the only person who can see the switch
  // is the one who flipped it.
  //
  // OPTIONAL on purpose. A plain proto3 bool cannot tell "this daemon says no"
  // from "this daemon is too old to say anything", and reading the second as
  // false would make every un-upgraded machine claim, positively, that it
  // accepts connections. Absent means unknown; the console shows nothing.
  optional bool block_incoming = 14;
  // Re-registration by proof alone (capability node_reauth): auth_key empty and
  // this set to the node id an earlier RegisterNode returned. The challenge must
  // be one issued for this node. The node keeps the meshnet, tags and owner it
  // enrolled with; nothing is taken from the request that an auth key would
  // have decided.
  int64 node_id = 15;
}

// DeclaredService is one entry of RegisterNodeRequest.declared_services.
message DeclaredService {
  string name = 1;   // MagicDNS-style label; it becomes an ACL "svc:" selector
  string proto = 2;  // "tcp" or "udp"
  // port is what mesh PEERS dial on this node's overlay address.
  uint32 port = 3;
  string note = 4;   // free text for the console; never interpreted
  // target is what the NODE ITSELF dials to reach the application, e.g.
  // "127.0.0.1:5432" or a box on its LAN. Empty means 127.0.0.1:<port>.
  //
  // The two differ for a reason worth stating: opening `port` in the packet
  // filter does nothing if the application is bound to loopback only, because a
  // peer's packet arrives on the tun interface addressed to the overlay address
  // and finds no socket there. Recording the target is also what lets a service
  // be published as a tunnel without asking for the address a second time — a
  // tunnel's local_addr IS this value.
  string target = 5;
}

message RegisterNodeResponse {
  int64 node_id = 1;
  // Allocated overlay address, e.g. "100.64.0.5".
  string overlay_addr = 2;
  // Negotiated working subset (intersection of node + coordinator caps).
  uint32 protocol_version = 3;
  repeated string capabilities = 4;
  // Names this session on every later node-scoped call (PullNetMap,
  // ReportEndpoints, ReportServiceHealth, UpdateNodeDeclarations). Valid until
  // the node registers again or the coordinator restarts; a node whose calls
  // start failing Unauthenticated registers again.
  string session_token = 5;
}

message GetRegisterChallengeRequest {
  // The auth key RegisterNode will present, so an anonymous caller cannot make
  // the coordinator hold challenge state.
  string auth_key = 1;
  // Re-registration by proof alone (capability node_reauth): no auth_key, and
  // instead the node this device already is. The challenge is issued only when
  // both name an existing, enabled, not signed-out node, and it is bound to that
  // node. See docs/runbook/self-hosted-sign-in-plan.md §四.
  int64 node_id = 2;
  string node_key = 3;
}

message SignOutRequest {
  string session_token = 1;
}

message SignOutResponse {}

message ListNodesRequest {
  // A live session's token, or a view token (OpenViewSession).
  string session_token = 1;
}

message ListNodesResponse {
  repeated NodeInfo nodes = 1;
}

// NodeInfo is one device as a list shows it.
message NodeInfo {
  int64 id = 1;
  string name = 2;
  string os = 3;
  string overlay_addr = 4;
  // Holds a live connection to the coordinator right now.
  bool online = 5;
  bool disabled = 6;
  // False while the meshnet requires device approval and nobody has given it.
  bool approved = 7;
  // Only services an admin confirmed.
  repeated PeerService services = 8;
  // Subnet routes it may carry; "0.0.0.0/0" makes it an exit device.
  repeated string approved_routes = 9;
  int64 last_seen_unix = 10;
}

// TunnelReport is one tunnel as the node's daemon serves it right now.
message TunnelReport {
  // The name in the daemon's configuration; unique on the node, and what the
  // coordinator keeps the tunnel's identity by from one report to the next.
  string name = 1;
  // "http", "https", "tcp", "udp" or "sni".
  string type = 2;
  // Where visitors reach it: a host name for http, https and sni; host:port for
  // tcp and udp. Empty until its edge has assigned one.
  string public_addr = 3;
  // What the daemon forwards to, host:port.
  string local_addr = 4;
  // "online" (its edge serves it), "pending" (registering with the edge) or
  // "offline" (the daemon is not connected to its edge).
  string status = 5;
  // Bytes since this node's last ACCEPTED report: from visitors to the local
  // service, and back. The daemon keeps counting until a report is accepted, so
  // a failed one delays the bytes rather than losing them.
  int64 bytes_in = 6;
  int64 bytes_out = 7;
}

message ReportTunnelsRequest {
  string session_token = 1;
  repeated TunnelReport tunnels = 2;
}

message ReportTunnelsResponse {}

message ListTunnelsRequest {
  // A live session's token, or a view token (OpenViewSession).
  string session_token = 1;
}

message ListTunnelsResponse {
  repeated TunnelInfo tunnels = 1;
}

// TunnelInfo is one tunnel as a list shows it.
message TunnelInfo {
  // Stable for as long as its node keeps reporting a tunnel by this name.
  int64 id = 1;
  int64 node_id = 2;
  string node_name = 3;
  // The node holds a live connection to the coordinator. When it does not, what
  // it last reported may no longer be true: a list shows the tunnel offline.
  bool node_online = 4;
  string name = 5;
  string type = 6;
  string public_addr = 7;
  string local_addr = 8;
  string status = 9;
  // Bytes both ways over the last 30 days. 0 when this coordinator keeps no
  // traffic records (see GetUsageResponse.unavailable).
  int64 traffic_30d = 10;
  // When the node first reported a tunnel by this name, and last reported at all.
  int64 first_seen_unix = 11;
  int64 reported_unix = 12;
}

message GetUsageRequest {
  // A live session's token, or a view token (OpenViewSession).
  string session_token = 1;
  // The viewer's IANA time zone ("America/New_York"): the days and the month
  // are the viewer's, since a self-hosted server has no billing month to follow.
  // Empty or unknown = UTC.
  string time_zone = 2;
  // How many days, today included: 1 to 31, default 7.
  int32 days = 3;
}

message GetUsageResponse {
  // Traffic: absent when this coordinator keeps no traffic records, and then
  // unavailable says why ("no_database"). A usage view shows that, not zeros.
  UsageMonth month = 1;
  repeated UsageDay days = 2;
  string unavailable = 3;
  // True when relayed traffic is not recorded (connection records switched off):
  // the figures are the tunnels alone.
  bool relay_not_recorded = 4;
  // Devices: in use (not disabled), disabled, and the most there may be
  // (-1 = no limit).
  int64 devices_used = 5;
  int64 devices_disabled = 6;
  int64 devices_limit = 7;
}

// UsageMonth is the viewer's current calendar month, [from, to).
message UsageMonth {
  int64 from_unix = 1;
  int64 to_unix = 2;
  int64 tunnel_bytes = 3;
  // Mesh traffic this server's relays carried, counted once: as its sender
  // reported it.
  int64 relay_bytes = 4;
}

// UsageDay is one of the viewer's days, oldest first; bytes = tunnels + relay.
message UsageDay {
  int64 start_unix = 1;
  int64 bytes = 2;
}

message OpenViewSessionRequest {
  int64 node_id = 1;
  string node_key = 2;
  // From GetRegisterChallenge(node_id, node_key), answered like RegisterNode's.
  string challenge_id = 3;
  bytes proof = 4;
}

message OpenViewSessionResponse {
  string view_token = 1;
  int64 expires_unix = 2;
}

message GetEdgeAccessRequest {
  // A live session's token, or a view token (OpenViewSession).
  string session_token = 1;
}

message GetEdgeAccessResponse {
  // The edges this node may serve tunnels through. Empty when the coordinator
  // knows of none.
  repeated EdgeInfo edges = 1;
  // meshproto.RelayGrant, signed by the coordinator: the node presents it to the
  // edge with a proof of its node key. Empty when the coordinator signs nothing.
  bytes grant = 2;
  // When the grant stops being accepted; ask again well before.
  int64 grant_expires_unix = 3;
}

// EdgeInfo is one edge as a node dials it.
message EdgeInfo {
  // host:port of the edge's control listener, as devices reach it.
  string addr = 1;
  // SHA-256 of the certificate's public key (meshproto.CertPin), "sha256:…".
  // Empty: check the certificate against the system's roots and the host name.
  string pin = 2;
}

message GetRegisterChallengeResponse {
  // Names the challenge on the RegisterNode that answers it. Single use,
  // short-lived, and bound to the meshnet auth_key resolved to.
  string challenge_id = 1;
  // Ephemeral public key || nonce (meshproto.RegisterChallenge).
  bytes challenge = 2;
}

// ServiceHealth is one service as the node itself sees it.
message ServiceHealth {
  string name = 1;
  // target_ok: the application answers where THIS MACHINE dials it.
  bool target_ok = 2;
  // mesh_ok: the machine can reach the service on its OWN overlay address, i.e.
  // the way a peer would. target_ok && !mesh_ok is the loopback-only case.
  bool mesh_ok = 3;
  // checked: false when the node could not test at all (a udp service, where a
  // connectionless dial proves nothing, or no overlay address yet). The two
  // booleans above are then meaningless — absence of a result is not a failure,
  // and rendering it as one would be worse than saying nothing.
  bool checked = 4;
}

message UpdateNodeDeclarationsRequest {
  // Not read by the coordinator; session_token (below) authorizes this call.
  string auth_key = 1;
  // Optional. When set it must be the node the session belongs to, otherwise
  // the call is refused with PermissionDenied.
  string node_key = 2;
  repeated DeclaredService declared_services = 3;
  // Empty means "no change", not "clear it". A node reports "" both when it has
  // no Publish-side registration yet and when its config momentarily won't
  // read, and the second must not erase a good value.
  string device_fingerprint = 4;
  // Mesh protocol v2: the session from RegisterNode is what authorizes this
  // call. auth_key and node_key above no longer do - an org key plus a node
  // key (public within an org) let any member edit a colleague's device.
  string session_token = 5;
  // Same "" means no change rule as device_fingerprint. Carried here so an
  // upgraded daemon fills the column on its next declaration push rather than
  // only after a full re-enrollment (which tears down WireGuard).
  string os = 6;
  // Same "unknown vs false" reasoning as RegisterNodeRequest.block_incoming, and
  // carried here for the same reason os is: flipping the switch must reach the
  // console on the next declaration push, not only after a re-enrollment (which
  // tears down WireGuard).
  optional bool block_incoming = 7;
}
message UpdateNodeDeclarationsResponse {
  int64 node_id = 1;
}

// ConnSample is one peer, over one window, as the REPORTING node saw it.
//
// Deltas, not totals: WireGuard's counters are cumulative and reset whenever the
// peer is reconfigured, so a total would double-count across a restart and go
// backwards across a reset. The node does that arithmetic because it is the only
// party that sees both readings.
message ConnSample {
  // The peer's node key. The coordinator resolves it to a node id within the
  // reporting node's own meshnet, so a key from another org resolves to nothing
  // and the sample is dropped.
  string peer_node_key = 1;
  // Window as unix seconds, half-open [start, end).
  int64 window_start = 2;
  int64 window_end = 3;
  // Bytes FROM this node TO the peer, and back, within the window.
  int64 bytes_tx = 4;
  int64 bytes_rx = 5;
  // "direct" or "relay" — how the traffic actually travelled. Not the endpoint
  // address: see the note on ReportConnections.
  string path = 6;
}

message ReportConnectionsRequest {
  // Authenticated by the session from RegisterNode, like the other post-
  // registration calls.
  string session_token = 1;
  string node_key = 2;
  repeated ConnSample samples = 3;
}

message ReportConnectionsResponse {
  // How many samples were stored. Fewer than sent means some peers did not
  // resolve inside this meshnet — the node can log that without retrying, since
  // a retry would resolve to nothing again.
  int32 stored = 1;
}

message ReportServiceHealthRequest {
  int64 node_id = 1;
  repeated ServiceHealth services = 2;
  // v1 put auth_key + node_key here; v1 was never released.
  reserved 3, 4;
  reserved "auth_key", "node_key";
  // From RegisterNodeResponse (mesh protocol v2), as on PullNetMapRequest.
  string session_token = 5;
}

message ReportServiceHealthResponse {}

message PullNetMapRequest {
  int64 node_id = 1;
  // v1 put auth_key + node_key here; v1 was never released.
  reserved 2, 3;
  reserved "auth_key", "node_key";
  // From RegisterNodeResponse (mesh protocol v2). The coordinator refuses the
  // stream without it, or when it belongs to a different node than node_id.
  string session_token = 4;
}

// NetMap is the ACL-filtered view of the meshnet a single node is allowed to
// see. Peers the ACL denies are ABSENT (first layer of isolation).
message NetMap {
  Peer self = 1;
  repeated Peer peers = 2;
  DERPMap derp_map = 3;
  // Packet filter this node ENFORCES on inbound traffic (MESH.5b). The
  // coordinator compiles it from the meshnet's ACL for this node specifically:
  // "these sources may reach these ports OF MINE". Enforcement is on the
  // RECEIVING side on purpose — a sender that lies (or is compromised) still
  // can't get past the receiver's own copy of the rules.
  //
  // Empty list = allow nothing beyond what the netmap already permits at the
  // host level; a node that is meant to be fully open gets an explicit
  // allow-everything rule instead. (Clients that predate this field ignore it
  // and keep host-level filtering only.)
  repeated FilterRule packet_filter = 4;
  // filter_enabled distinguishes the two very different meanings of an EMPTY
  // packet_filter:
  //   false — this coordinator doesn't compile filters (an older build): the
  //           node must NOT filter, or upgrading a client would cut its traffic.
  //   true  — the filter is authoritative: an empty list means "nothing may
  //           reach me", which is what an ACL that names this node in no rule
  //           actually says.
  // A field that could be inferred from the list being empty would have to pick
  // one of those, and either choice is an outage for the other case.
  bool filter_enabled = 5;
  // relay_grant is the coordinator's signed authorization for THIS node to use
  // relays (R0'). Opaque here on purpose: the node forwards the bytes verbatim
  // to a relay, which verifies them with the coordinator's public key held as
  // static config — so a relay decides who may connect WITHOUT ever talking to
  // the control plane. Format and rules in ../relaygrant.go.
  //
  // Empty means the node has no authorization to present. That is the normal
  // state on a coordinator that doesn't issue grants (relays then must not
  // require them), and it is also how an org over its traffic quota is cut off
  // from the platform's relays — note the coordinator downgrades the grant's
  // SCOPE rather than withholding it, so the org keeps the relays it runs
  // itself. See docs/runbook/facility-and-service-model.md §3.5.
  //
  // Grants expire, so the coordinator re-sends the netmap well before they do;
  // a relay may also re-challenge a live link at any time.
  bytes relay_grant = 6;
  // self_services is the coordinator's registry of the services registered on
  // THIS node, sent so the node can self-check them (F3b).
  //
  // Needed because the registry is not only what the node declared. A manager
  // can enter a service in the console (F4a), and nothing else ever pushes that
  // back down — so without this field a console-authored service could never
  // show a reachability result at all. That is exactly the kind most likely to
  // be pointed at the wrong address, since nobody was standing at the machine
  // when it was entered.
  //
  // OBSERVATION ONLY, and the direction is worth being explicit about. This is
  // the coordinator handing a node addresses to dial, which sounds like it
  // widens what the control plane can make a machine do — it does not: an org
  // admin can already point that daemon anywhere via a tunnel's local_addr, and
  // a probe is strictly weaker (connect, then close, nothing forwarded).
  // Nothing here authorizes anything; the result is a badge on the node's own
  // row. Only this node's own services appear, and only APPROVED ones (the same
  // set the ACL sees) — a node's own unconfirmed declarations are already in its
  // config, so it checks those without being told.
  repeated DeclaredService self_services = 7;
  // subnet_aliases is sent to a SUBNET ROUTER about ITSELF: the stand-in prefix
  // the coordinator published for each of its aliased routes. Peers only ever
  // see the alias (it is what lands in this node's allowed_ips); this node needs
  // both halves so it can install the 1:1 rewrite that turns one into the other.
  //
  // Empty for every node that is not an aliased subnet router, which is nearly
  // all of them.
  repeated SubnetAlias subnet_aliases = 8;
  // unaliased_routes are this node's own routes that asked for a stand-in
  // prefix, were approved, and did not get one — the meshnet is at its alias
  // budget, the subnet is too large to alias, or the pool is full.
  //
  // They still work: they publish under their real CIDR, so every consumer that
  // does not collide with them reaches them exactly as before. The ones that DO
  // collide cannot, and that is the failure this field exists to make visible —
  // the operator who asked for the alias is the only person who can act on it,
  // and the alternative is a line in the coordinator's log that nobody reads.
  repeated string unaliased_routes = 9;
  // alias_budget_addrs / alias_used_addrs are the meshnet's alias budget and
  // its current usage, in ADDRESSES (a /24 is 256, a /16 is 65536). Sent so the
  // node can say WHY instead of only THAT: "your organisation's budget is 256
  // and all of it is in use" is something to act on; "no alias" is not.
  uint32 alias_budget_addrs = 10;
  uint32 alias_used_addrs = 11;
  // MagicDNS records land here in MESH.6.
}

// SubnetAlias is one real subnet and the unique prefix standing in for it.
//
// Same size, always: the host bits are positional, so alias .222 IS real .222.
// That is what lets the router rewrite with one stateless rule rather than a
// lookup table, and what lets a person who knows the NAS is .222 find it without
// consulting anything. See docs/runbook/mesh-subnet-alias-nat-plan.md.
message SubnetAlias {
  string alias = 1;
  string real = 2;
}

// FilterRule allows traffic from any of src_cidrs to any of dst_ports on the
// receiving node. Ports are the node's OWN listening ports.
message FilterRule {
  repeated string src_cidrs = 1;
  repeated PortRange dst_ports = 2;
}

// PortRange is an inclusive port span for one protocol. proto is "tcp", "udp",
// or "" for any; first=0,last=65535 means every port.
message PortRange {
  uint32 first = 1;
  uint32 last = 2;
  string proto = 3;
}

message Peer {
  int64 node_id = 1;
  string node_key = 2;
  string disco_key = 3;
  string overlay_addr = 4;
  // Allowed IPs routed to this peer (its /32 + any subnet routes it advertises).
  repeated string allowed_ips = 5;
  // Known candidate endpoints for direct connections (host:port).
  repeated string endpoints = 6;
  // Region code of the peer's DERP home relay.
  string derp_home = 7;
  // MagicDNS label — the node's name, resolved to its overlay IP by the
  // client-side resolver (MESH.6).
  string name = 8;
  // Services this peer offers, so a client can say what a machine is FOR rather
  // than only what it is called. Only CONFIRMED ones travel: the coordinator
  // assembles peers through nodesWithServices, which drops unapproved rows
  // before the ACL — and before this — so a claim nobody authorised is never
  // advertised to anybody.
  //
  // A separate message from DeclaredService, deliberately. That one also carries
  // `target` (what the node ITSELF dials — often a loopback or LAN address) and
  // `note` (an admin's free text), and neither is a peer's business: the target
  // is internal topology a peer cannot use and should not learn. Leaving those
  // fields out of the type makes that structural instead of a comment someone
  // later "completes".
  repeated PeerService services = 9;
  // The peer's platform, as it reported at registration ("windows", "linux",
  // "darwin"). Empty from a node that enrolled before this was collected —
  // render nothing then, not "unknown", which reads as a finding.
  string os = 10;
}

// PeerService is what one peer publishes about a service it offers: the three
// things a caller needs to reach it, and nothing else. See Peer.services.
message PeerService {
  string name = 1;   // the ACL "svc:" selector, and what a human recognises
  string proto = 2;  // "tcp" or "udp"
  uint32 port = 3;   // what peers dial on this node's overlay address
}

message DERPMap {
  repeated DERPRegion regions = 1;
}

message DERPRegion {
  string code = 1; // e.g. "lax", "sgp"
  repeated DERPNode nodes = 2;
}

message DERPNode {
  string host_name = 1;
  int32 derp_port = 2;
  int32 stun_port = 3;
}

message ReportEndpointsRequest {
  int64 node_id = 1;
  repeated string endpoints = 2; // host:port candidates
  // Region code of the relay the node measured as its LOWEST-latency home
  // (MESH.4 B2b). The node picks it by probing each region's STUN endpoint from
  // the DERP map; the coordinator accepts it only if the region exists in the
  // map it published, and distributes it to peers as this node's derp_home so
  // they relay via the closest hop. Empty = no change (keep the current home).
  string home_region = 3;
  // v1 put auth_key + node_key here; v1 was never released.
  reserved 4, 5;
  reserved "auth_key", "node_key";
  // From RegisterNodeResponse (mesh protocol v2), as on PullNetMapRequest.
  string session_token = 6;
}

message ReportEndpointsResponse {}

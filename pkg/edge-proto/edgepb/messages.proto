// [mirrored from proto/calabi/v1/control_plane/identity.proto]
// EdgeNode is one row in the edge directory ListEdges returns.
message EdgeNode {
  int64  edge_node_id            = 1;
  string node_label              = 2;
  string region                  = 3;
  // host:port the daemon should dial for the control listener
  // (typically the edge's :7443 endpoint).
  string public_addr             = 4;
  // True when the row passes the freshness check at query time.
  bool   healthy                 = 5;
  // 0 = unknown; populated by edge in heartbeat to influence client
  // selection (the daemon prefers lightly-loaded edges in the same
  // region).
  int32  active_clients          = 6;
  google.protobuf.Timestamp last_seen_at = 7;
  // M15: VPC-internal "host:port" a SAME-REGION peer edge dials to
  // forward a visitor connection for a tunnel this edge owns (edge mesh
  // HA). NOT public — never exposed via bff-console /v1/edges; only the
  // in-cluster / bff-edge ListEdges path carries it. Empty = this edge
  // doesn't participate in peer forwarding (single-edge region / mesh
  // disabled).
  string internal_addr           = 8;
  // edge_class buckets the platform edge pool for plan-tier routing.
  //   "shared"    — the default pool every plan may land on.
  //   "dedicated" — the paid "independent pool". Plans entitled with
  //                 features.dedicated_edge (any PAID plan — Basic/Pro/Business/
  //                 Custom since 2026-06-22) are routed here; FREE is HARD-
  //                 filtered off it by bff-console so the free crowd can't
  //                 contend a paying org's pooled capacity (the per-org token
  //                 bucket already caps RATE — dedicated buys contention/uplink-
  //                 headroom isolation, not a higher cap).
  // Self-declared by the edge in its config (edge_class:); empty is treated
  // as "shared" everywhere, so legacy/unset edges keep serving every plan.
  // BYOI (owned) edges ignore this — they're always offered to their owner.
  //
  // NOTE: ListEdges returns the EFFECTIVE class here — i.e. edge_class_override
  // when an operator has pinned one, otherwise the edge's self-declared value.
  // bff-console routing only ever reads this effective field; the raw override
  // is surfaced separately (below) for the admin console.
  string edge_class              = 9;
  // edge_class_override is the operator-set value of edge_class that SURVIVES
  // heartbeats (the edge's own register call can't clobber it). "" = no
  // override (follow the edge's self-declared edge_class); "shared"/"dedicated"
  // force the pool. Set via AdminUpdateEdgeNode. Populated only on the
  // bff-admin ListEdges path; the daemon/bff-console path leaves it empty
  // because it consumes the already-resolved `edge_class` above.
  string edge_class_override     = 10;
  // reserved_org_id pins this PLATFORM edge to a single org for true single-
  // tenant "dedicated" capacity (the hybrid model's operator-assigned add-on).
  // 0 = not reserved (serves the shared/dedicated pools by edge_class as
  // usual). When >0, bff-console HIDES this edge from every OTHER org and PINS
  // the owning org's tunnels onto it. This is SOFT routing isolation: the per-
  // org token bucket + tunnel-svc-authoritative claim already prevent cross-
  // tenant data leakage, so reserving buys reserved capacity (no noisy
  // neighbour), not a new security boundary. Distinct from BYOI ownership
  // (id-range-encoded + cert-derived, the customer's own VPS): a reserved edge
  // is PLATFORM-operated hardware we set aside for one customer. Admin-set;
  // never touched by the heartbeat upsert.
  int64  reserved_org_id         = 11;
  // Mesh relay endpoint (edge/derp merge): the DERP/STUN ports this edge's
  // in-process relay listens on when it runs role=relay|both. The relay's host
  // is host(public_addr) — a merged node serves control and relay on one host.
  // relay_derp_port == 0 means this edge runs no relay; the coordinator builds
  // its platform DERP map from the rows where it is > 0, so no separate map file
  // is maintained. Populated only on the in-cluster / bff-edge ListEdges path.
  int32  relay_derp_port         = 12;
  int32  relay_stun_port         = 13;
  // The wildcard domain this node serves visitor traffic on — the SUFFIX a
  // tunnel's hostname gets: <prefix>.<base_domain>. Platform nodes carry a
  // region domain ("lax.calabi.online"); a self-hosted (BYOI) node carries the
  // org's own. Self-declared in the boot upsert. Empty = a node older than the
  // field; readers must fall back rather than show an empty suffix.
  string base_domain             = 14;
}


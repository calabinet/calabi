  string current_snapshot_sha = 4;
}

// [mirrored from proto/calabi/v1/control_plane/cert.proto]
message IssueEdgeCertResponse {
  // PEM-encoded leaf cert (CN = "edge-{id}-{region}").
  bytes cert_pem = 1;
  // PEM-encoded private key (PKCS#8). CLEARTEXT on the wire —
  // bff-admin is responsible for serving the response over TLS.
  bytes key_pem = 2;
  // PEM-encoded CA bundle. Edge installs this as its trusted root for
  // verifying bff-edge's server cert.
  bytes ca_pem = 3;
  // Serial number in hex (lowercase, no leading zeros). Stable handle
  // for Revoke / List.
  string serial_hex = 4;
  google.protobuf.Timestamp not_before = 5;
  google.protobuf.Timestamp not_after  = 6;
  // The edge id baked into the cert. Echoed back so a BYOI self-serve
  // caller (edge_node_id=0 in the request) learns the auto-allocated id to
  // put in its edge config.
  int64 edge_node_id = 7;
}

// [mirrored from proto/calabi/v1/control_plane/cert.proto]
message ListCertsRequest {
  int64       org_id = 1;
  PageRequest page   = 2;
  // Also return certs that were REVOKED (never ones merely deleted). Opt-in
  // and default-false on purpose: this same RPC feeds the edge's serving pool
  // and bff-console's domain cascade, and a revoked cert reappearing in either
  // is the exact failure revocation exists to prevent. Only the console's
  // certificate list — which shows them as history, greyed and inert — asks
  // for them.
  bool include_revoked = 3;
}

// [mirrored from proto/calabi/v1/control_plane/cert.proto]
message ListCertsResponse {
  repeated CertMeta items = 1;
  PageResponse page = 2;
}


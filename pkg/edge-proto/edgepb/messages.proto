// [mirrored from proto/calabi/v1/control_plane/identity.proto]
// PresenceClient is one entry in ReportClientPresenceRequest.clients.
// Added 2026-05-28 — old edges using `client_ids` still work (server
// promotes each id to a PresenceClient with org_id=0), but those rows
// won't be counted by GetOrgOnlineCount until the edge upgrades.
message PresenceClient {
  int64 client_id = 1;
  // Org the client authenticated as. Server denormalizes onto the
  // session row so GetOrgOnlineCount is a single-table count. 0 =
  // legacy edge that didn't supply it; row's org_id stays unchanged.
  int64 org_id    = 2;
  // Monotonic per-connection epoch: the reporting edge's wall-clock
  // unix-millis at the moment this control session was established
  // (session.New). identity-svc keeps the HIGHEST epoch per client_id
  // and refuses to let a LOWER-epoch report overwrite edge_node_id.
  // This stops an old edge that hasn't yet reaped a now-dead session
  // from "stealing" the presence row back after the client re-homed to
  // a new edge (the new connection always carries a larger epoch). A
  // genuine re-home wins instantly (newer epoch); a stale straggler
  // can't. 0 = legacy edge that didn't supply it; the server then
  // falls back to last-writer-wins for that report (pre-guard behavior).
  int64 conn_epoch = 3;
}

// [mirrored from proto/calabi/v1/control_plane/tunnel.proto]
// ReclaimTunnelRequest hands a tunnel from an evicted edge to a new one.
// See the RPC comment for the fencing semantics.
message ReclaimTunnelRequest {
  int64  tunnel_id            = 1;
  int64  new_edge_node_id     = 2;
  string new_edge_node_label  = 3;
  int64  org_id               = 4;          // org guard, same idea as ClaimTunnel
  int64  evicted_edge_node_id = 5;          // who we think currently owns it
  // Minimum seconds the evicted edge must have been silent on presence
  // for the reclaim to be considered safe. Server clamps to a 60s floor.
  int32  staleness_seconds    = 6;
  // Monotonic counter the caller bumps on each reclaim attempt.
  // Server refuses anything <= the row's current value. Counter zero on
  // un-migrated rows means the first reclaim always wins.
  int64  fencing_token        = 7;
}

// [mirrored from proto/calabi/v1/control_plane/tunnel.proto]
message ReclaimTunnelResponse {
  Tunnel tunnel = 1;
  // True when the row was actually transferred. False + no error means
  // someone else already moved it (caller is stale; just refetch).
  bool   reclaimed = 2;
}


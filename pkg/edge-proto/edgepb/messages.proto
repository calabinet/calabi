// messages.proto — the self-contained message set of the bff-edge contract.
//
// WHY THIS FILE EXISTS (docs/runbook/full-oss-plan.md F3)
//
// bff_edge.proto used to declare its RPCs directly over
// calabi.v1.control_plane.* messages. That made the "narrow edge-facing
// gateway" an illusion at the code level: those messages generate into ONE
// monolithic Go package carrying all 11 control-plane services -- ~150 RPC
// signatures including every Admin* one -- so anything that linked bff_edge
// linked the entire internal API surface. It is the single reason the platform
// edge could not be published.
//
// The definitions below are MIRRORS of the control_plane messages the edge
// actually exchanges: same field numbers, same types, so the wire format is
// byte-identical and no coordinated redeploy is needed. What changes is only
// which Go package they generate into.
//
// MAINTENANCE CONTRACT -- read before editing:
//
//  1. This file is HAND-MAINTAINED, not generated. It was bootstrapped once by
//     scripts/gen-bffedge-mirror.py, and that script is a diff aid, not a build
//     step. Auto-deriving it would make bff_edge a shadow of control_plane
//     rather than an independent contract, and every internal edit would
//     silently rewrite the public one. A public contract changes deliberately.
//
//  2. Field numbers here MUST match the control_plane original. The bridge at
//     apps/bff-edge/internal/server converts between the two by re-encoding on
//     the wire, so a mismatched tag silently moves data into the wrong field.
//     TestMirroredMessagesMatchControlPlane compares the descriptors and fails
//     when they drift -- do not skip it.
//
//  3. Adding a field to a mirrored message upstream does NOT require adding it
//     here. Extra fields on either side are dropped by the bridge, which is
//     correct: the edge should receive only what its contract promises. Add it
//     here when the EDGE needs it.
//
//  4. Never mirror a message the edge does not exchange. The point of the
//     exercise is that the public tree carries the edge-facing contract and
//     nothing else.

syntax = "proto3";

package calabi.v1.bff_edge;

option go_package = "github.com/calabi/calabi/pkg/edge-proto/edgepb;edgepb";

import "google/protobuf/timestamp.proto";

// [mirrored from proto/calabi/v1/control_plane/config.proto]
message Ack {
  string delta_id = 1;
  bool   ok       = 2;
  string error   = 3;
}

// [mirrored from proto/calabi/v1/control_plane/cert.proto]
// CertMeta is the audit-safe view of a cert row. Excludes anything
// secret. SANs are the cert's SubjectAlternativeNames as parsed at
// upload time; the lookup-by-domain logic on edge uses these.
message CertMeta {
  ResourceMeta meta = 1;

  int64    org_id      = 2;
  string   name        = 3;            // user-supplied label, unique per org
  string   fingerprint = 4;            // sha256:HEX of the DER cert
  string   issuer      = 5;            // X509 Issuer.CommonName
  string   subject     = 6;            // X509 Subject.CommonName
  repeated string sans = 7;            // dns names
  google.protobuf.Timestamp not_before = 8;
  google.protobuf.Timestamp not_after  = 9;

  // Source: "uploaded" for static M3; "acme-letsencrypt" / "acme-aliyun"
  // etc. in M4. Free-form to absorb new CAs without a proto v2.
  string source = 10;

  // When the renewal cron will pick this cert up (not_after minus its
  // lookahead window). Set ONLY for certs the cron actually renews — the scan
  // filters on source prefix "acme-", so an uploaded cert leaves this empty
  // rather than promising a renewal that will never happen. Never set on a
  // revoked cert: nothing renews it, and a date there would read as a promise.
  google.protobuf.Timestamp renew_at = 11;

  // Set once the CA has accepted a revocation. Present ONLY on rows returned
  // with ListCertsRequest.include_revoked — the default list is what is live.
  //
  // It is deliberately separate from meta.deleted_at, which a revoked row also
  // carries. Deleted means "we stopped serving it"; revoked means "the CA was
  // told, and no client anywhere should accept it again". The second is a fact
  // about the world that outlives our row, so it gets its own field and its own
  // history entry rather than being inferred from an absence.
  google.protobuf.Timestamp revoked_at    = 12;
  // RFC 5280 CRLReason, as passed to the CA. 0 = unspecified (what the domain
  // cascade sends), 1 = keyCompromise (what the console's revoke button sends).
  // Meaningless unless revoked_at is set.
  int32                     revoke_reason = 13;
}

// [mirrored from proto/calabi/v1/control_plane/tunnel.proto]
// ClaimTunnelRequest patches a pending tunnel (edge_node_id=0) with the
// runtime fields the edge now owns. Sent by calabi-edge in response to a
// NEW_PROXY frame carrying claim_tunnel_id.
//
//   - id              : tunnel-svc row id being claimed.
//   - edge_node_id    : numeric edge id (must be non-zero).
//   - edge_node_label : human-readable edge id from edge config.
//   - domain          : assigned domain for http/https/sni; "" for tcp/udp.
//   - remote_port     : assigned port for tcp/udp; 0 for the other kinds.
//   - org_id          : sanity check; server rejects if it doesn't match
//                       the row's org_id. Bandwidth-zero, dramatically
//                       limits blast radius of a misrouted claim.
//   - client_id       : same idea for client_id, if the row has one set.
message ClaimTunnelRequest {
  int64  id              = 1;
  int64  edge_node_id    = 2;
  string edge_node_label = 3;
  string domain          = 4;
  int32  remote_port     = 5;
  int64  org_id          = 6;
  int64  client_id       = 7;
  // M12 — the calling edge's local base_domain (e.g. "edge1.calabi.net").
  // Same semantics as CreateTunnelRequest.base_domain — used for the
  // zone-edge consistency check in per-edge wildcard DNS deploys. Required
  // when domain falls under any managed base; empty means "edge didn't
  // declare a base; tunnel-svc skips the per-edge cross-check and falls
  // back to the global BASE_DOMAINS allowlist only".
  string base_domain     = 8;
  // BYOI: authenticated org of the calling edge (bff-edge-stamped, >0 only
  // for BYOI edges). tunnel-svc rejects a claim targeting a platform-managed
  // domain — BYOI is custom-domain-only. See byoi-plan.md BYOI.5.
  int64  caller_org_id   = 9;
}

// [mirrored from proto/calabi/v1/control_plane/config.proto]
message ConfigMessage {
  oneof kind {
    Snapshot snapshot = 1;
    Delta    delta    = 2;
  }
}

// [mirrored from proto/calabi/v1/control_plane/tunnel.proto]
message CreateTunnelRequest {
  int64  org_id       = 1;
  int64  workspace_id = 2;
  int64  client_id    = 3;
  string name         = 4;
  string type         = 5;
  string local_addr   = 6;
  string domain       = 7;
  int32  remote_port  = 8;
  string config_json  = 9;
  // M11.20.6 — set ONLY by edge-internal callers (tunnelstore.Client.
  // Persist) so the row goes in with a real edge ownership stamp and
  // the (edge_node_id, remote_port) unique check fires on insert. The
  // user-facing bff-console REST handler does NOT forward this field —
  // user rows continue to start at edge_node_id=0 and get their ownership
  // assigned by the edge via ClaimTunnel. See server.CreateTunnel notes.
  int64  edge_node_id = 10;
  // M12 — the calling edge's local base_domain (e.g. "edge1.calabi.net").
  // Set by edge-internal callers ONLY. tunnel-svc uses it for the
  // zone-edge consistency check in the per-edge wildcard DNS deployment
  // mode: if `domain` falls under any managed base (TUNNEL_SVC_BASE_-
  // DOMAINS), it MUST equal/end-with THIS base_domain. Without this,
  // edge1 could mistakenly claim *.edge2.calabi.net after a daemon
  // reconnect, and DNS would route the traffic to edge2 where the proxy
  // isn't registered (silent 404). Empty in user-facing paths (which
  // create rows at edge_node_id=0 — checked when an edge later Claims).
  string base_domain   = 11;
  // subdomain (Phase 2, 2026-06-07) — user-requested platform subdomain
  // PREFIX for http/https (基础版+). bff-console forwards it from the
  // create form; tunnel-svc stores it on the row; the daemon resolves it
  // to a full managed subdomain using the connected edge's base_domain at
  // NEW_PROXY time. Mutually exclusive with a custom `domain`. Empty =
  // auto-allocated subdomain (the edge mints u%06d.<base> at claim).
  string subdomain = 12;
  // BYOI: authenticated org of the calling edge (bff-edge-stamped, >0 only
  // for single-tenant BYOI edges). tunnel-svc rejects when set and the
  // tunnel targets a platform-managed domain — BYOI is custom-domain-only.
  // See docs/runbook/byoi-plan.md BYOI.5.
  int64  caller_org_id = 13;
  // creator_user_id — set by the user-facing bff-console path from the caller
  // principal's user id, so the row is attributed to its creator for org RBAC
  // visibility. Edge-internal callers leave it 0 (their rows are claimed, not
  // user-created). See docs/runbook/org-resource-visibility-rbac.md.
  int64  creator_user_id = 14;
}

// [mirrored from proto/calabi/v1/control_plane/tunnel.proto]
message DeleteTunnelRequest  {
  int64 id = 1;
  // BYOI: the authenticated org of the calling edge (stamped by bff-edge
  // from its mTLS cert). >0 ⇒ tunnel-svc enforces target.org == caller_org_id;
  // 0 = trusted in-cluster caller (no cross-org gate). See byoi-plan.md.
  int64 caller_org_id = 2;
}

// [mirrored from proto/calabi/v1/control_plane/tunnel.proto]
message DeleteTunnelResponse {}

// [mirrored from proto/calabi/v1/control_plane/config.proto]
message Delta {
  string delta_id    = 1;
  string parent_sha  = 2;       // expected previous snapshot sha
  bytes  patch_json  = 3;       // RFC 6902 JSON Patch
}

// [mirrored from proto/calabi/v1/control_plane/tunnel.proto]
// DrainEdgeRequest releases every tunnel owned by edge_node_id back to
// the pool (edge_node_id=0 + status=disabled).
message DrainEdgeRequest {
  int64  edge_node_id = 1;
  // When true, broadcast a routes.delete event for each drained tunnel
  // so other edges drop their in-process route cache. Use for emergency
  // takedowns; the soft default is safer for routine maintenance.
  bool   hard         = 2;
  // Caller-supplied reason string included in audit logs (e.g.
  // "k8s pre-stop", "manual drain edge-prod-3").
  string reason       = 3;
}

// [mirrored from proto/calabi/v1/control_plane/tunnel.proto]
message DrainEdgeResponse {
  int32 drained = 1;
}

// [mirrored from proto/calabi/v1/control_plane/config.proto]

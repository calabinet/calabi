version: v2
# LOCAL-plugin codegen for the edge contract (no network, no protoc — just the
# Go plugins on PATH: protoc-gen-go, protoc-gen-go-grpc). Run from this dir:
#   cd pkg/edge-proto && buf generate
# Output lands next to the .proto (paths=source_relative), so edgepb/*.proto ->
# edgepb/*.pb.go (package edgepb).
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
inputs:
  - directory: .
